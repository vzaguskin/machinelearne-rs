[package]
name = "machinelearne-rs"
version.workspace = true
edition.workspace = true

[lib]

[dependencies]
ndarray = { workspace = true, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
rand = { version = "0.8", features = ["small_rng"] }

# WGPU backend dependencies (optional)
wgpu = { version = "24.0", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }
futures = { version = "0.3", optional = true }

# BLAS backend dependencies (optional)
blas-src = { version = "0.10", optional = true }

# ONNX export dependencies (optional)
prost = { version = "0.13", optional = true }
prost-types = { version = "0.13", optional = true }

# ONNX inference dependencies (optional)
# Use system ONNX Runtime library instead of downloading prebuilt binaries
# Note: The "cuda" feature for ort requires CUDA 11.6+ to be installed
ort = { version = "2.0.0-rc.11", default-features = false, features = ["std", "pkg-config"], optional = true }

# ONNX server dependencies (optional)
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "macros", "time"], optional = true }
axum = { version = "0.8", optional = true }
serde_json = { version = "1.0", optional = true }
clap = { version = "4.0", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3.10"
serde_json = "1.0"
criterion = "0.5"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = "0.3.22"

[[bench]]
name = "onnx_inference"
harness = false
required-features = ["onnx"]

[build-dependencies]
prost-build = { version = "0.13", optional = true }

[features]
default = ["cpu", "serde"]
serde = ["dep:serde", "dep:bincode"]
cpu = []
ndarray = ["dep:ndarray"]

# GPU backends
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:futures"]
cuda = []
metal = []
spirv = []
# cudarc = ["dep:cudarc"]  # Optional: enable cudarc for real GPU support
# tch = ["dep:tch"]
# burn = ["dep:burn"]

# BLAS backends (Priority 2)
blas = ["dep:blas-src", "dep:ndarray"]
blas-openblas = ["blas", "blas-src/openblas"]
blas-netlib = ["blas", "blas-src/netlib"]
blas-accelerate = ["blas", "blas-src/accelerate"]

# ONNX export and inference
onnx = ["dep:prost", "dep:prost-types", "dep:prost-build"]
onnx-inference = ["onnx", "dep:ort", "dep:ndarray"]
onnx-server = ["onnx-inference", "dep:tokio", "dep:axum", "dep:serde_json", "dep:clap"]
onnx-cuda = ["onnx-inference", "ort?/cuda"]

# Examples that require specific features
[[example]]
name = "export_mlp_onnx"
required-features = ["onnx"]
