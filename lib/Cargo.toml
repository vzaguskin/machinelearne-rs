[package]
name = "machinelearne-rs"
version.workspace = true
edition.workspace = true

[lib]

[dependencies]
ndarray = { workspace = true, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
rand = { version = "0.8", features = ["small_rng"] }

# WGPU backend dependencies (optional)
wgpu = { version = "24.0", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }
futures = { version = "0.3", optional = true }

# BLAS backend dependencies (optional)
blas-src = { version = "0.10", optional = true }

# ONNX export dependencies (optional)
prost = { version = "0.13", optional = true }
prost-types = { version = "0.13", optional = true }

# ONNX inference dependencies (optional)
ort = { version = "2.0.0-rc.11", optional = true }

[dev-dependencies]
tempfile = "3.10"
serde_json = "1.0"
criterion = "0.5"

[[bench]]
name = "onnx_inference"
harness = false
required-features = ["onnx"]

[build-dependencies]
prost-build = { version = "0.13", optional = true }

[features]
default = ["cpu", "serde"]
serde = ["dep:serde", "dep:bincode"]
cpu = []
ndarray = ["dep:ndarray"]

# GPU backends
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:futures"]
cuda = []
metal = []
spirv = []
# cudarc = ["dep:cudarc"]  # Optional: enable cudarc for real GPU support
# tch = ["dep:tch"]
# burn = ["dep:burn"]

# BLAS backends (Priority 2)
blas = ["dep:blas-src", "dep:ndarray"]
blas-openblas = ["blas", "blas-src/openblas"]
blas-netlib = ["blas", "blas-src/netlib"]
blas-accelerate = ["blas", "blas-src/accelerate"]

# ONNX export and inference
onnx = ["dep:prost", "dep:prost-types", "dep:prost-build"]
onnx-inference = ["onnx", "dep:ort", "dep:ndarray"]
