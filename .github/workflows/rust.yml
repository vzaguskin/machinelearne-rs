name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  COVERAGE_THRESHOLD: 85
  # Features to test on Linux CI (exclude platform-specific BLAS backends)
  CI_FEATURES: "serde,ndarray,wgpu"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --features "$CI_FEATURES" -- -D warnings

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build workspace
        run: cargo build --workspace --verbose

      - name: Run tests (library only)
        run: cargo test -p machinelearne-rs --features "$CI_FEATURES" --verbose

  coverage:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run coverage (library only, exclude benchmarks and GPU backends)
        run: cargo tarpaulin -p machinelearne-rs --features "serde,ndarray" --exclude-files "lib/src/backend/wgpu_backend/*" --exclude-files "lib/src/backend/cuda/*" --exclude-files "lib/src/backend/metal/*" --exclude-files "lib/src/backend/spirv/*" --out Xml --fail-under $COVERAGE_THRESHOLD

  benchmarks:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn

      - name: Build benchmarks (release)
        run: cargo build --release -p benchmarks

      - name: Run Rust benchmark binary (smoke test)
        run: cargo run --release -p benchmarks --bin fair_comparison || true
        continue-on-error: true
